live_key_prefix_note: >-
  Dynatrace token prefixes (dt0s01 API token, dt0s02/dt0s03 OAuth clients, dt0s04 chat and
  identity linking, dt0s06 refresh token) distinguish token TYPE, not test versus live. There is
  no test-mode counterpart to any of them.


provider: Dynatrace
providerId: dynatrace
description: >-
  First-party Dynatrace client libraries, app-development SDKs and distributed binaries. Dynatrace
  runs two clearly separated SDK generations. The @dynatrace-sdk/* npm scope is the CURRENT
  AppEngine/platform generation and is actively released (most packages shipped within the last
  month). The OneAgent SDK family — Java, .NET, Node.js, Python, C — is the LEGACY in-process
  instrumentation generation and is effectively frozen: the .NET package last shipped in 2021 and
  the Java and Node.js packages in 2023, which is the clearest published decay signal in this
  provider's package estate.


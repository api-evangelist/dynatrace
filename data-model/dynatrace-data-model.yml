identifier_conventions:
- field: entityId
  shape: TYPE-HEX, e.g. HOST-0000000000000000
  note: Dynatrace entity IDs carry their entity type as a prefix, so the type is readable from the ID
    without a lookup.
- field: problemId
  note: Opaque Davis problem identifier used by getProblem, closeProblem and the problem comment thread.
- field: account-uuid
  shape: UUID
  note: Root scoping path parameter for every Account Management operation.
- field: group-uuid
  shape: UUID
- field: policy-uuid
  shape: UUID
- field: nextPageKey
  note: Opaque pagination cursor, not an entity identifier — see conventions/dynatrace-conventions.yml.
render: json-ld/ contexts and vocabulary/dynatrace-vocabulary.yaml carry the vocabulary view of the same
  objects.

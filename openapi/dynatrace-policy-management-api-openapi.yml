components:
  schemas:
    EffectivePermissions:
      type: object
      properties:
        effectivePermissions:
          description: List of effective permissions.
          type: array
          items:
            $ref: '#/components/schemas/EffectivePermission'
      required:
      - effectivePermissions
    AppendLevelPolicyBindingForGroupDto:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties:
            type: string
          description: Parameters provided for bindings
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata provided for bindings
        boundaries:
          description: List of boundary UUIDs used in the binding.
          type: array
          items:
            type: string
    Binding:
      type: object
      properties:
        policyUuid:
          type: string
          description: The ID of the policy.
        groups:
          description: A list of user groups to which the policy applies.
          type: array
          items:
            type: string
        parameters:
          type: object
          additionalProperties:
            type: string
          description: Parameters from bound policies
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Metadata from bound policies
        boundaries:
          description: List of boundary UUIDs used in the binding.
          type: array
          items:
            type: string
      required:
      - policyUuid
      - groups
      - boundaries
    LimitEntry:
      type: object
      properties:
        count:
          type: number
        limit:
          type: string
      required:
      - count
      - limit
    ErrorDto:
      type: object
      properties:
        code:
          type: number
          description: The code of the error.
        message:
          type: string
          description: A short description of the error.
        errorsMap:
          type: object
          additionalProperties:
            type: string
      required:
      - code
      - message
      - errorsMap
    ValidationDto:
      type: object
      properties:
        warnings:
          description: A list of validation warnings.
          type: array
          items:
            type: string
      required:
      - warnings
    AppendLevelPolicyBindingsRequestDto:
      type: object
      properties:
        groups:
          description: A list of user groups (specified by IDs) to which the policy applies.
          type: array
          items:
            type: string
        boundaries:
          description: List of boundary UUIDs used in the binding.
          type: array
          items:
            type: string
      required:
      - groups
    EffectiveBinding:
      type: object
      properties:
        groupUuid:
          type: string
          description: The UUID of group
        levelType:
          type: string
          description: The type of the level to which the binding applies.
        levelId:
          type: string
          description: The ID of the level to which the binding applies.
      required:
      - groupUuid
      - levelType
      - levelId
    EffectivePolicy:
      type: object
      properties:
        uuid:
          type: string
          description: The ID of the policy.
        name:
          type: string
          description: The display name of the policy.
        statementQuery:
          type: string
          description: The statement query of the policy.
        levelType:
          type: string
          description: The type of the level to which the policy applies.
        levelId:
          type: string
          description: The ID of the level to which the policy applies.
      required:
      - uuid
      - name
      - statementQuery
      - levelType
      - levelId
    PolicyBoundaryOverview:
      type: object
      properties:
        uuid:
          type: string
        levelType:
          type: string
        levelId:
          type: string
        name:
          type: string
          description: The display name of the policy boundary.
        boundaryQuery:
          type: string
          description: The boundary query of the policy boundary.
        boundaryConditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
        metadata:
          description: The metadata of the policy boundary.
          allOf:
          - $ref: '#/components/schemas/Map'
      required:
      - uuid
      - levelType
      - levelId
      - name
      - boundaryQuery
      - boundaryConditions
      - metadata
    PolicyDtoList:
      type: object
      properties:
        policies:
          description: A list of policies.

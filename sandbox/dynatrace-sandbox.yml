cost_awareness:
  note: >-
    Read access to the Dynatrace API is documented as free of charge on a fair-use model, but
    DEFINING and PUSHING new custom metrics is charged per metric per month, and DQL queries
    against Grail consume licence units. An agent exploring this API can therefore incur cost
    without writing any configuration — the Dynatrace MCP README carries the same warning about
    example prompts leading to billable DQL.
  source: https://docs.dynatrace.com/docs/dynatrace-api/basics/access-limit

safe_exploration:
  - Read operations (listEntities, listProblems, listEvents, listMetrics) are the fair-use free path.
  - >-
    The local MCP server shipped a reset_grail_budget tool specifically to cap Grail spend during
    agent exploration; that tool has no remote equivalent, so budget control on the remote MCP
    server is a Dynatrace-side setting rather than a callable guard.


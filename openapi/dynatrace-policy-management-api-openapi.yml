openapi: 3.2.0
info:
  title: Dynatrace Account Management Policy Management API
  description: The enterprise management API for Dynatrace SaaS enables automation of operational tasks related to user access and environment lifecycle management.
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Policy Management
  description: Manage IAM policies, policy bindings, and permission boundaries.
paths:
  /iam/v1/repo/{level-type}/{level-id}/policies/validation:
    post:
      deprecated: true
      description: 'Deprecated since Mon, 15 Jun 2026 00:00:00 GMT. This endpoint will be removed on Mon, 11 Jan 2027 00:00:00 GMT.


        This endpoint is unavailable within global level. Validation moved to create/update policy endpoints.'
      operationId: validateNewLevelPolicy
      parameters:
      - name: level-id
        required: true
        in: path
        description: "The ID of the policy level. Use one of the following values, depending on the level type: \n\n* account: use the UUID of the account. \n* environment: use the ID of the environment."
        schema: {}
      - name: level-type
        required: true
        in: path
        description: "The type of the [policy](https://dt-url.net/eu03uap) level. The following values are available: \n\n* `account`: An account policy applies to all environments of an account. \n* `environment`: An environment policy applies to a specific environment. \n\n Each level inherits the policies of the higher level and extends them with its own policies."
        schema: {}
      requestBody:
        required: true
        description: The JSON body of the request. Contains the configuration of a policy to be validated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateLevelPolicyRequestDto'
      responses:
        '200':
          description: Success. The submitted policy is valid. Check the response body for possible validation warnings.
          headers:
            Deprecation:
              description: The date from which this endpoint is deprecated.
              schema:
                type: string
                example: Mon, 15 Jun 2026 00:00:00 GMT
            Sunset:
              description: The date after which this endpoint will return 410 Gone.
              schema:
                type: string
                example: Mon, 11 Jan 2027 00:00:00 GMT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationDto'
        '400':
          description: Failed. The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Failed. The specified resource is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '410':
          description: This endpoint has been removed.
        '422':
          description: The specified response not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
      security:
      - bearer: []
      summary: Validates the payload for the `POST /iam/v1/repo/{levelType}/{levelId}/policies`…
      tags:
      - Policy Management
      x-token-scopes:
      - iam-policies-management
      - iam:policies:read
  /iam/v1/repo/{level-type}/{level-id}/policies/validation/{policy-uuid}:
    post:
      deprecated: true

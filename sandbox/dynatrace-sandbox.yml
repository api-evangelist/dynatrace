description: >-
  Dynatrace publishes NO test-mode API. There is no sandbox host, no test-vs-live key prefix pair,
  and no fixture or simulation tooling. What it offers instead is a time-boxed free trial that
  provisions a REAL tenant — so every call an agent makes during evaluation runs against
  production infrastructure and consumes real licence units. This is a meaningful difference from
  a payments-style sandbox and should not be recorded as one.


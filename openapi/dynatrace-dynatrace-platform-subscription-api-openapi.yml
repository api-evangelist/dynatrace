openapi: 3.2.0
info:
  title: Dynatrace Account Management Dynatrace Platform… Dynatrace…
  description: The enterprise management API for Dynatrace SaaS enables automation of operational tasks related to user access and environment lifecycle management.
  version: '1.0'
  contact: {}
servers: []
tags:
- name: Dynatrace Platform Subscription
  description: View platform subscriptions and their usage, cost, forecast, and rate-card data.
paths:
  /sub/v2/accounts/{account-uuid}/subscriptions:
    get:
      operationId: SubscriptionsController_listSubscriptions
      parameters:
      - name: account-uuid
        required: true
        in: path
        description: "The ID of the required account. \n\n You can find the UUID on the **Account Management** > **Identity & access management** > **OAuth clients** page, during creation of an OAuth client."
        schema:
          type: string
      responses:
        '200':
          description: Success. The response contains a list of the account's subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionListDto'
        '400':
          description: Failed. The request was unacceptable, often due to missing a required parameter
        '401':
          description: Failed. The bearer token is incorrect/expired or the requested account information does not match the bearer token
        '403':
          description: Access denied
        '404':
          description: Failed. The requested resource was not found
        '500':
          description: Failed. Something went wrong in Account Management API
      security:
      - bearer: []
      summary: Lists all subscriptions of an account
      tags:
      - Dynatrace Platform Subscription
      x-required-permissions:
      - account-viewer
      x-token-scopes:
      - account-uac-read
  /sub/v2/accounts/{account-uuid}/subscriptions/forecast:
    get:
      operationId: SubscriptionsController_getForecast
      parameters:
      - name: account-uuid
        required: true
        in: path
        description: "The ID of the required account. \n\n You can find the UUID on the **Account Management** > **Identity & access management** > **OAuth clients** page, during creation of an OAuth client."
        schema:
          type: string
      responses:
        '200':
          description: Success. The response contains the forecast of the subscription's usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
        '400':
          description: Failed. The request was unacceptable, often due to missing a required parameter
        '401':
          description: Failed. The bearer token is incorrect/expired or the requested account information does not match the bearer token
        '403':
          description: Access denied
        '404':
          description: Failed. The requested resource was not found
        '500':
          description: Failed. Something went wrong in Account Management API
      security:
      - bearer: []
      summary: Gets a forecast of the subscription usage by the end of the annual commitment…
      tags:
      - Dynatrace Platform Subscription
      x-required-permissions:
      - account-viewer
      x-token-scopes:
      - account-uac-read
  /sub/v2/accounts/{account-uuid}/subscriptions/{subscription-uuid}:
    get:
      operationId: SubscriptionsController_getSubscription
      parameters:
      - name: account-uuid
        required: true
        in: path
        description: "The ID of the required account. \n\n You can find the UUID on the **Account Management** > **Identity & access management** > **OAuth clients** page, during creation of an OAuth client."
        schema:
          type: string
      - name: subscription-uuid
        required: true
        in: path
        description: "The UUID of the requested subscription. \n\nFetch the list of subscriptions via the [GET all subscriptions](https://dt-url.net/jq03jvq) request."
        schema:
          type: string
      responses:
        '200':
          description: Success. The response contains the details of the subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
        '400':
          description: Failed. The request was unacceptable, often due to missing a required parameter
        '401':
          description: Failed. The bearer token is incorrect/expired or the requested account information does not match the bearer token
        '403':
          description: Access denied
        '404':
          description: Failed. The requested resource was not found
        '500':
          description: Failed. Something went wrong in Account Management API
      security:
      - bearer: []
      summary: Get a subscription
      tags:
      - Dynatrace Platform Subscription
      x-required-permissions:
      - account-viewer
      x-token-scopes:
      - account-uac-read
  /sub/v2/accounts/{account-uuid}/subscriptions/{subscription-uuid}/environments/usage:
    get:
      deprecated: true
      description: 'Deprecated since Mon, 15 Jun 2026 00:00:00 GMT. Use the new version instead. This endpoint will be removed on Mon, 11 Jan 2027 00:00:00 GMT.


        This endpoint is SaaS only.'
      operationId: getEnvironmentUsage
      parameters:
      - name: account-uuid
        required: true
        in: path
        description: "The ID of the required SaaS account. \n\n You can find the UUID on the **Account Management** > **Identity & access management** > **OAuth clients** page, during creation of an OAuth client."
        schema:
          type: string
      - name: subscription-uuid
        required: true
        in: path
        description: "The UUID of the requested subscription. \n\nFetch the list of subscriptions via the [GET all subscriptions](https://dt-url.net/jq03jvq) request."
        schema:
          type: string
      - name: startTime
        required: true
        in: query
        description: The start of the requested timeframe in `2021-05-01T15:11:00Z` format.
        schema:
          type: string
          format: date-time
      - name: endTime
        required: true
        in: query
        description: The end of the requested timeframe in `2021-05-01T15:11:00Z` format.
        schema:
          type: string
          format: date-time
      - name: environmentIds
        required: false
        in: query
        description: A list of environments for which you want to read the usage data. To specify several environments, separate them with a comma (`,`).
        schema:
          type: array
          items:
            type: string
      - name: capabilityKeys
        required: false
        in: query
        description: "A list of capabilities for which you want to read the usage data. To specify several capabilities, separate them with a comma (`,`). \n\nTo obtain capability keys, use the [GET subscriptions](https://dt-url.net/qd43uld) call and look for the **capabilities** field of the response."
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success. The response contains the usage data of the subscription, split by environment.
          headers:
            Deprecation:
              description: The date from which this endpoint is deprecated.
              schema:
                type: string
                example: Mon, 15 Jun 2026 00:00:00 GMT
            Sunset:
              description: The date after which this endpoint will return 410 Gone.
              schema:
                type: string
                example: Mon, 11 Jan 2027 00:00:00 GMT
            Link:
              description: Link to the successor endpoint.
              schema:
                type: string
                example: </sub/v3/accounts/{accountUuid}/subscriptions/{subscriptionUuid}/environment-usage>; rel="successor-version"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionEnvironmentUsageListV2Dto'
        '400':
          description: Failed. The request was unacceptable, often due to missing a required parameter
        '401':
          description: Failed. The bearer token is incorrect/expired or the requested account information does not match the bearer token
        '403':
          description: Access denied
        '404':
          description: Failed. The requested resource was not found
        '410':
          description: This endpoint has been removed. Use the [new version](#/Dynatrace%20Platform%20Subscription/getEnvironmentUsageV3) instead.
        '500':
          description: Failed. Something went wrong in Account Management API
      security:
      - bearer: []
      summary: Gets the account usage of a SaaS subscription per environment
      tags:
      - Dynatrace Platform Subscription
      x-required-permissions:
      - account-viewer
      x-token-scopes:
      - account-uac-read

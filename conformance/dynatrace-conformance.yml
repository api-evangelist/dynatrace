description: >-
  Cross-cutting and domain standards Dynatrace's contracts and identity surface actually declare.
  The headline is the domain standard: Dynatrace serves NATIVE OpenTelemetry Protocol ingest
  endpoints at the standard OTLP signal paths, which means an OpenTelemetry-instrumented estate
  points at Dynatrace by changing an endpoint variable rather than by writing a connector.

conformance:
  - id: opentelemetry-otlp
    name: OpenTelemetry Protocol (OTLP)
    domain: observability
    conforms: true
    domain_standard: true
    evidence:
      location: >-
        Dynatrace SaaS OTLP base URL https://{your-environment-id}.live.dynatrace.com/api/v2/otlp,
        with the standard OpenTelemetry signal paths appended: /v1/traces, /v1/metrics, /v1/logs.
      quote: >-
        "Dynatrace provides native OTLP endpoints" and "The ingest paths used by Dynatrace for the
        individual signal types follow the standard OpenTelemetry paths."
      url: https://docs.dynatrace.com/docs/ingest-from/opentelemetry/getting-started/otlp-export
      status: 200
    deviations:
      - >-
        gRPC transport is NOT supported. Dynatrace's own change history records "Clarified that
        gRPC is not supported", so OTLP/HTTP is the only accepted transport — an OTLP exporter
        configured for gRPC will not reach Dynatrace.
      - >-
        API authentication is required for SaaS and ActiveGate exports, which the base OTLP
        specification does not itself mandate.
    additional_surfaces:
      - Environment ActiveGate: https://{your-activegate-domain}:9999/e/{your-environment-id}/api/v2/otlp
      - Dynatrace Collector — an OpenTelemetry Collector distribution for batching and transforming before forward
    note: >-
      OTLP is the observability market's interchange standard. A buyer already emitting OTLP
      integrates with no bespoke connector; one who is not needs a vendor agent. That is exactly
      the distinction domain_standard_conformance is meant to draw.

